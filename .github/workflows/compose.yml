name: EcoShare PostgreSQL Compose

permissions:
  contents: read

on:
  push:
    paths:
      - compose.yaml
      - .env.example
      - .github/workflows/compose.yml
      - src/server/prisma/**
      - src/server/package*.json
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - .github/workflows/compose.yml
      - src/server/prisma/**
      - src/server/package*.json

jobs:
  postgres-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: ecoshare-compose-ci
      DATABASE_URL: postgresql://ecoshare:ecoshare@127.0.0.1:5432/ecoshare?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL and wait for readiness
        run: docker compose up -d --wait --wait-timeout 120 db
      - run: npm ci
        working-directory: src/server
      - run: npm run db:generate
        working-directory: src/server
      - run: npm run db:deploy
        working-directory: src/server
      - run: npm run db:seed
        working-directory: src/server
      - run: npm run db:check
        working-directory: src/server
      - name: Recreate the container while retaining its data volume
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 120 db
      - name: Verify persisted data without reseeding
        run: npm run db:check
        working-directory: src/server
      - name: Show database diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color db
      - name: Remove the disposable CI database and volume
        if: always()
        run: docker compose down --volumes
