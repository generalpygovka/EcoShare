
name: EcoShare checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecoshare_test
          POSTGRES_USER: ecoshare
          POSTGRES_PASSWORD: ecoshare
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ecoshare -d ecoshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ecoshare:ecoshare@127.0.0.1:5433/ecoshare_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        working-directory: src/server
      - run: npm test
        working-directory: src/server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        working-directory: src/client
      - run: npm run build
        working-directory: src/client

  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ecoshare:ecoshare@127.0.0.1:5432/ecoshare?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        working-directory: src/server
      - run: npm run db:validate
        working-directory: src/server
      - run: npm run db:generate
        working-directory: src/server
